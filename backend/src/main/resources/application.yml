server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: opms-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:buvibuvi346@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:laoauctokclzsetd}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

opms:
  jwt:
    secret: 9a2f8c4e7b1a5d3f6e8c0b2d4f6a8c1e3b5d7f9a2c4e6b8d0f2a4c6e8b0d2f4a
    expiration-ms: 86400000
  mail:
    from: ${SPRING_MAIL_USERNAME:buvibuvi346@gmail.com}
    enabled: ${MAIL_ENABLED:true}

---
# H2 Dev Profile (default - no MySQL required)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:opms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

---
# MySQL Production Profile
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/opms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: com.opms.config.CustomMySQLDialect
